<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Flowchart Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f6fa;color:#243047}
header{background:#fff;padding:14px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}.sub{font-size:13px;color:#69758a;margin-top:4px}
.toolbar,.branchbar{background:#fff;padding:10px 20px;border-bottom:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}
.branchbar{background:#fafbfe}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e8edf5;color:#243047}
button:disabled{opacity:.45;cursor:not-allowed}
.run{background:#222;color:#fff;font-size:16px}.undo{background:#eee4ff;color:#5d3b86}.clear{background:#ffe5e5;color:#a22}
.yes{background:#e8f5e9}.no{background:#fff0f0}
main{max-width:1200px;margin:18px auto;padding:0 16px}
.help,.status{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:14px}
.status{min-height:48px}.status.ok{border:2px solid #444}
.canvas{height:720px;background:#fff;border:1px solid #ddd;border-radius:14px;overflow:auto}
svg{display:block;width:100%;height:100%;min-width:900px;background:linear-gradient(#f8faff 1px,transparent 1px),linear-gradient(90deg,#f8faff 1px,transparent 1px);background-size:25px 25px}
.node{cursor:pointer}.node rect,.node polygon{fill:#fff;stroke:#39465a;stroke-width:2}
.node.selected rect,.node.selected polygon{stroke-width:4}
.node text{pointer-events:none;user-select:none}
.arrow{stroke:#657184;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
.branch-label{font-size:14px;font-weight:700;fill:#39465a}
@media(max-width:700px){header{display:block}h1{font-size:19px}.canvas{height:650px}.toolbar,.branchbar{padding:8px 10px}}
</style>
</head>
<body>

<header>
  <div>
    <h1>SVG Flowchart Lab</h1>
    <div class="sub">เครื่องมือเขียน Flowchart แบบง่าย สำหรับนักเรียน</div>
  </div>
  <button id="runBtn" class="run">▶ Run</button>
</header>

<div class="toolbar">
  <button data-add="start">Start</button>
  <button data-add="input">Input</button>
  <button data-add="process">Process</button>
  <button data-add="output">Output</button>
  <button data-add="if">If</button>
  <button data-add="end">End</button>
  <button id="editBtn">แก้ข้อความ</button>
  <button id="deleteBtn">ลบ</button>
  <button id="connectBtn">เชื่อมบล็อก</button>
  <button id="undoBtn" class="undo">↶ Undo</button>
  <button id="clearBtn" class="clear">ล้างทั้งหมด</button>
</div>

<div class="branchbar">
  <span id="branchHint">เลือก If เพื่อเพิ่มบล็อกในแขนง</span>
  <button id="yesBtn" class="yes" disabled>+ เพิ่มใน Yes</button>
  <button id="noBtn" class="no" disabled>+ เพิ่มใน No</button>
</div>

<main>
  <div class="help">
    <b>วิธีใช้:</b> คลิกบล็อก → เพิ่มสัญลักษณ์เพื่อแทรกต่อจากบล็อกที่เลือก
    → หรือกด <b>เชื่อมบล็อก</b> แล้วคลิกบล็อกต้นทาง → คลิกบล็อกปลายทาง
    → If ใช้แขนง Yes/No → ดับเบิลคลิกแก้ข้อความ → Undo → Run
  </div>

  <div id="status" class="status">พร้อมใช้งาน</div>

  <div class="canvas">
    <svg id="svg" viewBox="0 0 1100 1000">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0 0L0 6L9 3z" fill="#657184"/>
        </marker>
      </defs>
      <g id="arrows"></g>
      <g id="nodes"></g>
    </svg>
  </div>
</main>

<script>
(function(){
"use strict";

const svg=document.getElementById("svg");
const nodesG=document.getElementById("nodes");
const arrowsG=document.getElementById("arrows");
const status=document.getElementById("status");
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const branchHint=document.getElementById("branchHint");

let nodes=[];
let edges=[];
let selectedId=null;
let nextId=1;
let history=[];
let dragging=null;
let dragMoved=false;
let dx=0,dy=0;
let connectMode=false;
let connectFrom=null;

const defaults={
  start:"Start",
  input:"รับค่า x",
  process:"x = x + 10",
  output:"แสดงค่า x",
  if:"x > 10 ?",
  end:"End"
};

function cloneState(){
  return JSON.parse(JSON.stringify({nodes,edges,selectedId,nextId}));
}

function saveHistory(){
  history.push(cloneState());
  if(history.length>50) history.shift();
}

function restoreState(state){
  nodes=state.nodes;
  edges=state.edges;
  selectedId=state.selectedId;
  nextId=state.nextId;
  layout();
  draw();
  updateBranchButtons();
}

function undo(){
  if(!history.length){
    status.textContent="ยังไม่มีรายการให้ Undo";
    return;
  }
  restoreState(history.pop());
  status.textContent="Undo: ย้อนกลับ 1 ขั้นแล้ว";
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function typeName(t){
  return {
    start:"Start / End",
    end:"Start / End",
    input:"Input",
    process:"Process",
    output:"Output",
    if:"Decision"
  }[t];
}

function shape(n){
  if(n.type==="start"||n.type==="end")
    return '<rect x="-90" y="-30" width="180" height="60" rx="30"/>';
  if(n.type==="process")
    return '<rect x="-100" y="-32" width="200" height="64"/>';
  if(n.type==="input"||n.type==="output")
    return '<polygon points="-105,-32 75,-32 105,32 -75,32"/>';
  return '<polygon points="0,-48 115,0 0,48 -115,0"/>';
}

function addNode(type){
  if(type==="start" && nodes.some(n=>n.type==="start")){
    status.textContent="มี Start อยู่แล้ว"; return;
  }
  if(type==="end" && nodes.some(n=>n.type==="end")){
    status.textContent="มี End อยู่แล้ว"; return;
  }

  saveHistory();

  const n={
    id:nextId++,
    type:type,
    text:defaults[type],
    branch:null,
    x:0,
    y:0
  };

  const selected=nodes.find(n=>n.id===selectedId);
  const end=nodes.find(n=>n.type==="end");

  if(type==="start"){
    nodes.unshift(n);
    if(selected && selected.type==="start"){
      // ไม่มีการเชื่อมซ้ำ
    }else{
      const first=nodes.find(x=>x.id!==n.id);
      if(first){
        edges=edges.filter(e=>!(e.to===first.id&&e.kind==="normal"));
        edges.push({from:n.id,to:first.id,kind:"normal"});
      }
    }
  }else if(type==="end"){
    nodes.push(n);
    // ถ้ามีบล็อกปกติตัวสุดท้าย ให้ต่อเข้า End
    const normal=nodes.filter(x=>!x.branch&&x.id!==n.id);
    const last=normal[normal.length-1];
    if(last && last.type!=="if"){
      edges=edges.filter(e=>e.to!==n.id);
      if(!edges.some(e=>e.from===last.id&&e.to===n.id))
        edges.push({from:last.id,to:n.id,kind:"normal"});
    }
  }else if(selected && selected.type==="if"){
    // เมื่อเลือก If ต้องใช้ปุ่ม Yes/No เพื่อสร้างแขนงเท่านั้น
    history.pop();
    alert("ถ้าเลือก If ให้กด “+ เพิ่มใน Yes” หรือ “+ เพิ่มใน No”");
    return;
  }else if(selected && selected.branch){
    // เพิ่มต่อจากบล็อกในแขนงเดิม
    n.branch=selected.branch;
    nodes.push(n);

    const outgoing=edges.find(e=>e.from===selected.id&&e.kind===selected.branch);
    if(outgoing){
      outgoing.from=n.id;
    }else{
      const branchNodes=nodes.filter(x=>x.branch===n.branch);
      const last=branchNodes[branchNodes.length-2];
      if(last) edges.push({from:last.id,to:n.id,kind:n.branch});
    }

    // ต่อบล็อกใหม่กลับไป End
    if(end){
      edges=edges.filter(e=>!(e.from===selected.id&&e.to===end.id));
      edges=edges.filter(e=>!(e.from===n.id&&e.to===end.id));
      edges.push({from:n.id,to:end.id,kind:n.branch});
    }
  }else if(selected && selected.type!=="end"){
    // แทรกต่อจากบล็อกที่เลือก
    const outgoing=edges.filter(e=>e.from===selected.id&&e.kind==="normal");
    outgoing.forEach(e=>e.from=n.id);
    edges.push({from:selected.id,to:n.id,kind:"normal"});
    nodes.push(n);
  }else if(end){
    const incoming=edges.filter(e=>e.to===end.id&&e.kind==="normal");
    if(incoming.length){
      incoming.forEach(e=>e.to=n.id);
      edges.push({from:n.id,to:end.id,kind:"normal"});
    }else{
      nodes.push(n);
      edges.push({from:n.id,to:end.id,kind:"normal"});
    }
  }else{
    nodes.push(n);
  }

  selectedId=n.id;
  layout();
  draw();
  updateBranchButtons();
  status.innerHTML=`เพิ่ม <b>${typeName(type)}</b> และเชื่อมต่อแล้ว`;
}
function addBranch(branch){
  const f=nodes.find(n=>n.id===selectedId&&n.type==="if");
  if(!f){alert("กรุณาเลือกบล็อก If ก่อน");return}

  saveHistory();

  const n={
    id:nextId++,
    type:"process",
    text:defaults.process,
    branch:branch,
    x:0,y:0
  };

  const branchNodes=nodes.filter(x=>x.branch===branch);
  nodes.push(n);

  if(branchNodes.length){
    const last=branchNodes[branchNodes.length-1];
    // ย้ายเส้นปลายแขนงเดิมมาไว้ที่บล็อกใหม่
    edges=edges.filter(e=>!(e.from===last.id&&e.kind===branch));
    edges.push({from:last.id,to:n.id,kind:branch});
  }else{
    edges.push({from:f.id,to:n.id,kind:branch});
  }

  const end=nodes.find(x=>x.type==="end");
  if(end){
    edges=edges.filter(e=>!(e.from===n.id&&e.to===end.id));
    edges.push({from:n.id,to:end.id,kind:branch});
  }

  selectedId=n.id;
  layout();
  draw();
  updateBranchButtons();
  status.innerHTML=`เพิ่ม Process ในแขนง <b>${branch==="yes"?"Yes":"No"}</b> และเชื่อมต่อแล้ว`;
}

function connectNodes(fromId,toId){
  if(fromId===toId){
    status.textContent="ไม่สามารถเชื่อมบล็อกเข้าหาตัวเองได้";
    return;
  }

  const a=nodes.find(n=>n.id===fromId);
  const b=nodes.find(n=>n.id===toId);
  if(!a||!b)return;

  // Start ไม่มีเส้นเข้ามา และ End ไม่มีเส้นออกไป
  if(b.type==="start"){
    status.textContent="ไม่สามารถเชื่อมเข้าหา Start ได้";
    return;
  }
  if(a.type==="end"){
    status.textContent="ไม่สามารถเชื่อมออกจาก End ได้";
    return;
  }

  // If ต้องเชื่อมไปยังบล็อกที่ระบุแขนง Yes/No
  let kind="normal";
  if(a.type==="if"){
    if(!b.branch){
      status.textContent="จาก If ให้ใช้ “+ เพิ่มใน Yes” หรือ “+ เพิ่มใน No” เพื่อสร้างแขนงก่อน";
      return;
    }
    kind=b.branch;
  }

  // บล็อกในแขนงเดียวกันต้องอยู่ในแขนงเดียวกัน
  if(a.branch && b.branch!==a.branch){
    status.textContent="บล็อกในแขนงต้องเชื่อมต่ออยู่ใน Yes เดียวกัน หรือ No เดียวกัน";
    return;
  }

  saveHistory();

  // ป้องกันเส้นซ้ำ
  edges=edges.filter(e=>!(e.from===a.id && e.kind===kind));

  edges.push({from:a.id,to:b.id,kind});

  connectMode=false;
  connectFrom=null;
  document.getElementById("connectBtn").textContent="เชื่อมบล็อก";
  selectedId=b.id;
  layout();
  draw();
  updateBranchButtons();

  status.innerHTML=`เชื่อม <b>${esc(a.text)}</b> → <b>${esc(b.text)}</b> แล้ว`;
}
function addNode(type){
  if(type==="start" && nodes.some(n=>n.type==="start")){
    status.textContent="มี Start อยู่แล้ว"; return;
  }
  if(type==="end" && nodes.some(n=>n.type==="end")){
    status.textContent="มี End อยู่แล้ว"; return;
  }

  saveHistory();

  const n={
    id:nextId++,
    type:type,
    text:defaults[type],
    branch:null,
    x:0,
    y:0
  };

  const selected=nodes.find(n=>n.id===selectedId);
  const end=nodes.find(n=>n.type==="end");

  if(type==="start"){
    nodes.unshift(n);
    if(selected && selected.type==="start"){
      // ไม่มีการเชื่อมซ้ำ
    }else{
      const first=nodes.find(x=>x.id!==n.id);
      if(first){
        edges=edges.filter(e=>!(e.to===first.id&&e.kind==="normal"));
        edges.push({from:n.id,to:first.id,kind:"normal"});
      }
    }
  }else if(type==="end"){
    nodes.push(n);
    // ถ้ามีบล็อกปกติตัวสุดท้าย ให้ต่อเข้า End
    const normal=nodes.filter(x=>!x.branch&&x.id!==n.id);
    const last=normal[normal.length-1];
    if(last && last.type!=="if"){
      edges=edges.filter(e=>e.to!==n.id);
      if(!edges.some(e=>e.from===last.id&&e.to===n.id))
        edges.push({from:last.id,to:n.id,kind:"normal"});
    }
  }else if(selected && selected.type==="if"){
    // เมื่อเลือก If ต้องใช้ปุ่ม Yes/No เพื่อสร้างแขนงเท่านั้น
    history.pop();
    alert("ถ้าเลือก If ให้กด “+ เพิ่มใน Yes” หรือ “+ เพิ่มใน No”");
    return;
  }else if(selected && selected.branch){
    // เพิ่มต่อจากบล็อกในแขนงเดิม
    n.branch=selected.branch;
    nodes.push(n);

    const outgoing=edges.find(e=>e.from===selected.id&&e.kind===selected.branch);
    if(outgoing){
      outgoing.from=n.id;
    }else{
      const branchNodes=nodes.filter(x=>x.branch===n.branch);
      const last=branchNodes[branchNodes.length-2];
      if(last) edges.push({from:last.id,to:n.id,kind:n.branch});
    }

    // ต่อบล็อกใหม่กลับไป End
    if(end){
      edges=edges.filter(e=>!(e.from===selected.id&&e.to===end.id));
      edges=edges.filter(e=>!(e.from===n.id&&e.to===end.id));
      edges.push({from:n.id,to:end.id,kind:n.branch});
    }
  }else if(selected && selected.type!=="end"){
    // แทรกต่อจากบล็อกที่เลือก
    const outgoing=edges.filter(e=>e.from===selected.id&&e.kind==="normal");
    outgoing.forEach(e=>e.from=n.id);
    edges.push({from:selected.id,to:n.id,kind:"normal"});
    nodes.push(n);
  }else if(end){
    const incoming=edges.filter(e=>e.to===end.id&&e.kind==="normal");
    if(incoming.length){
      incoming.forEach(e=>e.to=n.id);
      edges.push({from:n.id,to:end.id,kind:"normal"});
    }else{
      nodes.push(n);
      edges.push({from:n.id,to:end.id,kind:"normal"});
    }
  }else{
    nodes.push(n);
  }

  selectedId=n.id;
  layout();
  draw();
  updateBranchButtons();
  status.innerHTML=`เพิ่ม <b>${typeName(type)}</b> และเชื่อมต่อแล้ว`;
}
function addBranch(branch){
  const f=nodes.find(n=>n.id===selectedId&&n.type==="if");
  if(!f){alert("กรุณาเลือกบล็อก If ก่อน");return}

  saveHistory();

  const n={
    id:nextId++,
    type:"process",
    text:defaults.process,
    branch:branch,
    x:0,y:0
  };

  const branchNodes=nodes.filter(x=>x.branch===branch);
  nodes.push(n);

  if(branchNodes.length){
    const last=branchNodes[branchNodes.length-1];
    // ย้ายเส้นปลายแขนงเดิมมาไว้ที่บล็อกใหม่
    edges=edges.filter(e=>!(e.from===last.id&&e.kind===branch));
    edges.push({from:last.id,to:n.id,kind:branch});
  }else{
    edges.push({from:f.id,to:n.id,kind:branch});
  }

  const end=nodes.find(x=>x.type==="end");
  if(end){
    edges=edges.filter(e=>!(e.from===n.id&&e.to===end.id));
    edges.push({from:n.id,to:end.id,kind:branch});
  }

  selectedId=n.id;
  layout();
  draw();
  updateBranchButtons();
  status.innerHTML=`เพิ่ม Process ในแขนง <b>${branch==="yes"?"Yes":"No"}</b> และเชื่อมต่อแล้ว`;
}

function connectNodes(fromId,toId){
  if(fromId===toId){status.textContent="ไม่สามารถเชื่อมบล็อกเข้าหาตัวเองได้";return}
  const a=nodes.find(n=>n.id===fromId),b=nodes.find(n=>n.id===toId);
  if(!a||!b)return;

  // ตัดเส้นปกติเดิมจากต้นทาง แล้วสร้างเส้นใหม่
  saveHistory();
  const kind=(a.type==="if" && b.branch)?b.branch:"normal";

  edges=edges.filter(e=>!(e.from===a.id && (e.kind==="normal"||e.kind===kind)));
  edges.push({from:a.id,to:b.id,kind});

  connectMode=false;
  connectFrom=null;
  document.getElementById("connectBtn").textContent="เชื่อมบล็อก";
  draw();
  status.innerHTML=`เชื่อม <b>${esc(a.text)}</b> → <b>${esc(b.text)}</b> แล้ว`;
}
function layout(){
  const f=nodes.find(n=>n.type==="if");
  const start=nodes.find(n=>n.type==="start");
  const end=nodes.find(n=>n.type==="end");

  // ก่อน If: เรียงกลางตามเส้น normal
  const normalBefore=f
    ? nodes.filter(n=>!n.branch && n.id!==end.id && nodes.indexOf(n)<=nodes.indexOf(f))
    : nodes.filter(n=>!n.branch && n.id!==end?.id);

  normalBefore.forEach((n,i)=>{
    n.x=550;
    n.y=70+i*120;
  });

  if(!f){
    const normal=nodes.filter(n=>!n.branch);
    normal.forEach((n,i)=>{n.x=550;n.y=70+i*120});
    return;
  }

  // ตำแหน่ง If ถ้ามี
  f.x=550;
  if(normalBefore.length) f.y=normalBefore.length*120+70;

  const yes=nodes.filter(n=>n.branch==="yes");
  const no=nodes.filter(n=>n.branch==="no");

  yes.forEach((n,i)=>{
    n.x=300;
    n.y=f.y+170+i*110;
  });

  no.forEach((n,i)=>{
    n.x=800;
    n.y=f.y+170+i*110;
  });

  if(end){
    end.x=550;
    end.y=f.y+170+Math.max(yes.length,no.length,1)*110;
  }

  svg.setAttribute("viewBox","0 0 1100 "+Math.max(1000,end?end.y+140:f.y+550));
}

function pointOnNode(n,side){
  if(side==="top")return{x:n.x,y:n.y-50};
  if(side==="bottom")return{x:n.x,y:n.y+50};
  if(side==="left")return{x:n.x-115,y:n.y};
  return{x:n.x+115,y:n.y};
}

function orthogonalPath(a,b,kind){
  // If -> branch: ออกจากมุมแหลมของ Diamond โดยตรง
  if(a.type==="if" && (kind==="yes"||kind==="no")){
    const side=kind==="yes"?"left":"right";
    const p1=pointOnNode(a,side);
    const x=b.x;
    const y=b.y-50;
    return `M ${p1.x} ${p1.y} L ${x} ${p1.y} L ${x} ${y}`;
  }

  // Branch -> End: ลงตรง แล้วหักเข้าหา End
  if(b.type==="end" && (kind==="yes"||kind==="no")){
    const p1=pointOnNode(a,"bottom");
    const x=b.x + (kind==="yes"?-75:75);
    const y=b.y-30;
    return `M ${p1.x} ${p1.y} L ${p1.x} ${y} L ${x} ${y}`;
  }

  // ปกติ: แนวตั้ง ถ้าอยู่แนวเดียวกัน
  const p1=pointOnNode(a,"bottom");
  const p2=pointOnNode(b,"top");
  if(Math.abs(p1.x-p2.x)<2)
    return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;

  const midY=(p1.y+p2.y)/2;
  return `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;
}

function draw(){
  nodesG.innerHTML="";
  arrowsG.innerHTML="";

  const hasBranches = nodes.some(n=>n.branch==="yes"||n.branch==="no");

  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.from);
    const b=nodes.find(n=>n.id===e.to);
    if(!a||!b)return;

    // เมื่อ If มีแขนงแล้ว ห้ามวาดเส้นปกติจาก If ลง End
    // เพราะเส้นออกจาก If ต้องเป็น Yes / No เท่านั้น
    if(a.type==="if" && hasBranches && e.kind==="normal") return;

    arrowsG.innerHTML+=`<path class="arrow" d="${orthogonalPath(a,b,e.kind)}"/>`;

    if(a.type==="if"&&(e.kind==="yes"||e.kind==="no")){
      const p=pointOnNode(a,e.kind==="yes"?"left":"right");
      const labelX=e.kind==="yes"?p.x-32:p.x+32;
      arrowsG.innerHTML+=`<text class="branch-label" x="${labelX}" y="${p.y-10}" text-anchor="middle">${e.kind==="yes"?"Yes":"No"}</text>`;
    }
  });

  nodes.forEach(n=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node"+(selectedId===n.id?" selected":""));
    g.setAttribute("transform",`translate(${n.x},${n.y})`);

    g.innerHTML=
      shape(n)+
      `<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">${esc(n.text)}</text>`;

    g.onclick=e=>{
      e.stopPropagation();

      if(connectMode){
        if(connectFrom===null){
          connectFrom=n.id;
          selectedId=n.id;
          status.innerHTML="ต้นทาง: <b>"+esc(n.text)+"</b> — ตอนนี้คลิกบล็อกปลายทาง";
          draw();
          return;
        }
        if(connectFrom===n.id){
          status.textContent="เลือกบล็อกปลายทางที่ต่างจากต้นทาง";
          return;
        }
        connectNodes(connectFrom,n.id);
        selectedId=n.id;
        updateBranchButtons();
        return;
      }

      selectedId=n.id;
      updateBranchButtons();
      status.innerHTML="เลือก: <b>"+typeName(n.type)+"</b> — "+esc(n.text);
      draw();
    };

    g.ondblclick=e=>{
      e.stopPropagation();
      selectedId=n.id;
      editNode();
    };

    g.onpointerdown=e=>startDrag(e,n);
    nodesG.appendChild(g);
  });
}

function updateBranchButtons(){
  const ok=nodes.some(n=>n.id===selectedId&&n.type==="if");
  yesBtn.disabled=!ok;
  noBtn.disabled=!ok;
  branchHint.textContent=ok
    ?"เลือกแขนงที่ต้องการเพิ่มบล็อกได้เลย"
    :"เลือก If เพื่อเพิ่มบล็อกในแขนง";
}

function editNode(){
  const n=nodes.find(x=>x.id===selectedId);
  if(!n){alert("กรุณาคลิกเลือกบล็อกก่อน");return}

  const v=prompt("แก้ข้อความในบล็อก:",n.text);
  if(v!==null&&v.trim()&&v.trim()!==n.text){
    saveHistory();
    n.text=v.trim();
    draw();
    updateBranchButtons();
  }
}

function deleteNode(){
  const n=nodes.find(x=>x.id===selectedId);
  if(!n){alert("กรุณาคลิกเลือกบล็อกก่อน");return}

  saveHistory();

  // ลบเส้นที่เกี่ยวข้องกับบล็อกนี้
  const incoming=edges.filter(e=>e.to===n.id);
  const outgoing=edges.filter(e=>e.from===n.id);

  edges=edges.filter(e=>e.from!==n.id&&e.to!==n.id);
  nodes=nodes.filter(x=>x.id!==n.id);

  // ถ้าลบ Start ให้ไม่สร้างเส้นใหม่
  // ถ้าลบ End ก็ปล่อยกราฟตามจริง
  // ถ้าลบบล็อกปกติ ให้เชื่อมเส้น normal เดิมผ่านบล็อกที่ถูกลบ
  if(n.type!=="if" && !n.branch){
    const inNormal=incoming.filter(e=>e.kind==="normal");
    const outNormal=outgoing.filter(e=>e.kind==="normal");
    inNormal.forEach(i=>{
      outNormal.forEach(o=>{
        if(i.from!==o.to) edges.push({from:i.from,to:o.to,kind:"normal"});
      });
    });
  }

  // ถ้าลบ If ให้ลบแขนงของ If ที่ไม่มีต้นทาง
  if(n.type==="if"){
    const orphanIds=nodes.filter(x=>x.branch==="yes"||x.branch==="no").map(x=>x.id);
    edges=edges.filter(e=>!orphanIds.includes(e.to) || e.kind==="normal");
    nodes=nodes.filter(x=>x.branch===null);
  }

  // ถ้าลบ End ให้จบที่บล็อกสุดท้ายโดยไม่สร้าง End ใหม่
  selectedId=null;
  layout();
  draw();
  updateBranchButtons();
  status.textContent="ลบบล็อกแล้ว และจัดการเส้นที่เกี่ยวข้องให้แล้ว";
}
function clearAll(){
  if(!nodes.length)return;
  if(!confirm("ต้องการล้าง Flowchart ทั้งหมดหรือไม่?"))return;
  saveHistory();
  nodes=[];
  edges=[];
  selectedId=null;
  draw();
  updateBranchButtons();
  status.textContent="ล้างเรียบร้อย — กด Undo เพื่อย้อนกลับได้";
}

function startDrag(e,n){
  e.preventDefault();
  e.stopPropagation();
  selectedId=n.id;
  dragMoved=false;
  updateBranchButtons();
  dragging=n;

  const p=svgPoint(e);
  dx=n.x-p.x;
  dy=n.y-p.y;
  svg.setPointerCapture(e.pointerId);
  draw();
}

function svgPoint(e){
  const r=svg.getBoundingClientRect();
  const v=svg.viewBox.baseVal;
  return{
    x:(e.clientX-r.left)*v.width/r.width,
    y:(e.clientY-r.top)*v.height/r.height
  };
}

svg.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const p=svgPoint(e);
  const nx=p.x+dx, ny=p.y+dy;
  if(Math.abs(nx-dragging.x)>2 || Math.abs(ny-dragging.y)>2){
    if(!dragMoved){ saveHistory(); dragMoved=true; }
    dragging.x=nx;
    dragging.y=ny;
    draw();
  }
});

svg.addEventListener("pointerup",()=>{
  if(!dragging)return;
  dragging=null;
  status.textContent=dragMoved?"จัดตำแหน่งบล็อกแล้ว":"เลือกบล็อกแล้ว";
  dragMoved=false;
});

svg.addEventListener("click",()=>{
  selectedId=null;
  updateBranchButtons();
  draw();
  status.textContent="ไม่ได้เลือกบล็อก";
});

function runFlow(){
  const start=nodes.find(n=>n.type==="start");
  const end=nodes.find(n=>n.type==="end");

  if(!start||!end){
    status.className="status";
    status.innerHTML="<b>Run ไม่ได้</b> — ต้องมี Start และ End";
    return;
  }

  const visited=[];
  let current=start.id;
  let guard=0;

  while(current!=null&&guard<200){
    guard++;
    const n=nodes.find(x=>x.id===current);
    if(!n)break;
    visited.push(n.text);

    if(n.id===end.id)break;

    const out=edges.filter(e=>e.from===n.id);
    if(n.type==="if"){
      // Run แบบง่าย: ให้เลือกเงื่อนไขจากข้อความ x > 10 โดยไม่รัน Python
      // แสดงโครงสร้างของทั้งสองแขนงแทน
      break;
    }

    current=out[0]?out[0].to:null;
  }

  if(guard>=200){
    status.className="status";
    status.innerHTML="<b>Run ไม่ได้</b> — พบการเชื่อมต่อวนซ้ำ";
    return;
  }

  let result=visited.map((x,i)=>`${i+1}. ${esc(x)}`).join("<br>");
  const f=nodes.find(n=>n.type==="if");

  if(f){
    const yes=nodes.filter(n=>n.branch==="yes").map(n=>esc(n.text));
    const no=nodes.filter(n=>n.branch==="no").map(n=>esc(n.text));
    result+=`<br><br><b>Decision:</b> ${esc(f.text)}`;
    result+=`<br>Yes → ${yes.join(" → ")||"ยังไม่มี"}`;
    result+=`<br>No → ${no.join(" → ")||"ยังไม่มี"}`;
  }

  status.className="status ok";
  status.innerHTML="<b>Run สำเร็จ</b><br>"+result;
  status.scrollIntoView({behavior:"smooth",block:"center"});
}

document.querySelectorAll("[data-add]").forEach(b=>{
  b.addEventListener("click",()=>addNode(b.dataset.add));
});
yesBtn.addEventListener("click",()=>addBranch("yes"));
noBtn.addEventListener("click",()=>addBranch("no"));
document.getElementById("connectBtn").addEventListener("click",()=>{
  connectMode=!connectMode;
  connectFrom=null;
  document.getElementById("connectBtn").textContent=connectMode?"ยกเลิกเชื่อม":"เชื่อมบล็อก";
  status.textContent=connectMode?"โหมดเชื่อมบล็อก: คลิกต้นทาง → คลิกปลายทาง":"ยกเลิกโหมดเชื่อมบล็อก";
});
document.getElementById("editBtn").addEventListener("click",editNode);
document.getElementById("deleteBtn").addEventListener("click",deleteNode);
document.getElementById("undoBtn").addEventListener("click",undo);
document.getElementById("clearBtn").addEventListener("click",clearAll);
document.getElementById("runBtn").addEventListener("click",runFlow);
