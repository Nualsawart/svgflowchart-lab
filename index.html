<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Flowchart Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f6fa;color:#243047}
header{background:#fff;padding:15px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}.sub{font-size:13px;color:#69758a;margin-top:4px}
.toolbar{background:#fff;padding:12px 20px;border-bottom:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#e8edf5;color:#243047}
button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}
.run{background:#222;color:#fff;font-size:16px}.undo{background:#eee4ff;color:#5d3b86}.clear{background:#ffe5e5;color:#a22}
.branchbar{display:flex;gap:8px;padding:8px 20px;background:#fafbfe;border-bottom:1px solid #e3e7ee}
.branchbar span{font-size:13px;padding:9px 2px;color:#69758a}
.yes{background:#e8f5e9}.no{background:#fff0f0}
main{max-width:1200px;margin:18px auto;padding:0 16px}
.help,.status{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:14px}
.status{min-height:48px}.status.ok{border:2px solid #444}
.canvas{height:700px;background:#fff;border:1px solid #ddd;border-radius:14px;overflow:auto}
svg{width:100%;height:100%;min-width:850px;background:linear-gradient(#f8faff 1px,transparent 1px),linear-gradient(90deg,#f8faff 1px,transparent 1px);background-size:25px 25px}
.node{cursor:pointer}.node rect,.node polygon{fill:#fff;stroke:#39465a;stroke-width:2}
.node.selected rect,.node.selected polygon{stroke-width:4}
.node text{pointer-events:none;user-select:none}.arrow{stroke:#657184;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
.branch-label{font-size:14px;font-weight:700;fill:#39465a}
@media(max-width:700px){header{display:block}h1{font-size:19px}.canvas{height:650px}.branchbar{padding:8px 10px}}
</style>
</head>
<body>
<header>
<div><h1>SVG Flowchart Lab</h1><div class="sub">เครื่องมือเขียน Flowchart แบบง่าย สำหรับนักเรียน</div></div>
<button id="runBtn" class="run" type="button">▶ Run</button>
</header>

<div class="toolbar">
<button type="button" data-add="start">Start</button>
<button type="button" data-add="input">Input</button>
<button type="button" data-add="process">Process</button>
<button type="button" data-add="output">Output</button>
<button type="button" data-add="if">If</button>
<button type="button" data-add="end">End</button>
<button id="editBtn" type="button">แก้ข้อความ</button>
<button id="deleteBtn" type="button">ลบ</button>
<button id="undoBtn" class="undo" type="button">↶ Undo</button>
<button id="clearBtn" class="clear" type="button">ล้างทั้งหมด</button>
</div>

<div class="branchbar">
<span id="branchHint">เมื่อเลือก If จะสามารถเพิ่มบล็อกในแขนง Yes / No ได้</span>
<button id="yesBtn" class="yes" type="button" disabled>+ เพิ่มใน Yes</button>
<button id="noBtn" class="no" type="button" disabled>+ เพิ่มใน No</button>
</div>

<main>
<div class="help"><b>วิธีใช้:</b> เลือก If → เพิ่มบล็อกใน <b>Yes</b> หรือ <b>No</b> → ดับเบิลคลิกแก้ข้อความ → Run เพื่อทดลอง</div>
<div id="status" class="status">พร้อมใช้งาน</div>
<div class="canvas">
<svg id="svg" viewBox="0 0 1100 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#657184"/></marker></defs>
<g id="arrows"></g><g id="nodes"></g>
</svg>
</div>
</main>

<script>
(function(){
"use strict";
const svg=document.getElementById("svg"),ng=document.getElementById("nodes"),ag=document.getElementById("arrows"),status=document.getElementById("status");
let nodes=[],selectedId=null,nextId=1,history=[],dragging=null,dx=0,dy=0;
const defaults={start:"Start",input:"รับค่า x",process:"x = x + 10",output:"แสดงค่า x",if:"x > 10 ?",end:"End"};
function clone(x){return JSON.parse(JSON.stringify(x))}
function save(){history.push({nodes:clone(nodes),selectedId,nextId});if(history.length>50)history.shift()}
function undo(){if(!history.length){status.textContent="ยังไม่มีรายการให้ Undo";return}let h=history.pop();nodes=h.nodes;selectedId=h.selectedId;nextId=h.nextId;layout();draw();status.textContent="Undo: ย้อนกลับ 1 ขั้นแล้ว"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function tname(t){return{start:"Start / End",end:"Start / End",input:"Input",process:"Process",output:"Output",if:"Decision"}[t]}
function shape(n){if(n.type==="start"||n.type==="end")return'<rect x="-90" y="-30" width="180" height="60" rx="30"/>';if(n.type==="process")return'<rect x="-100" y="-32" width="200" height="64"/>';if(n.type==="input"||n.type==="output")return'<polygon points="-105,-32 75,-32 105,32 -75,32"/>';return'<polygon points="0,-48 115,0 0,48 -115,0"/>'}
function addLinear(type,afterId=null){
 if((type==="start"||type==="end")&&nodes.some(n=>n.type===type)){status.textContent=`มี ${tname(type)} อยู่แล้ว`;return}
 save();let n={id:nextId++,type,text:defaults[type],branch:null,x:0,y:0};
 if(type==="start")nodes.unshift(n);
 else if(type==="end")nodes.push(n);
 else{let i=afterId?nodes.findIndex(x=>x.id===afterId):-1;if(i>=0&&nodes[i].type!=="end")nodes.splice(i+1,0,n);else{let e=nodes.findIndex(x=>x.type==="end");e<0?nodes.push(n):nodes.splice(e,0,n)}}
 selectedId=n.id;layout();draw();status.innerHTML=`เพิ่ม <b>${tname(type)}</b> แล้ว`;
}
function addToBranch(branch){
 const ifNode=nodes.find(n=>n.id===selectedId&&n.type==="if");
 if(!ifNode){alert("กรุณาเลือกบล็อก If ก่อน");return}
 save();
 const n={id:nextId++,type:"process",text:defaults.process,branch,x:0,y:0};
 const all=nodes;
 const ifIndex=all.findIndex(x=>x.id===ifNode.id);
 // Insert immediately after the If; branch ordering is represented by branch field.
 // Multiple branch nodes are grouped by branch during layout.
 all.splice(ifIndex+1,0,n);
 selectedId=n.id;layout();draw();status.innerHTML=`เพิ่ม Process ในแขนง <b>${branch==="yes"?"Yes":"No"}</b> แล้ว`;
}
function layout(){
 let normal=nodes.filter(n=>!n.branch);
 normal.forEach((n,i)=>{n.x=550;n.y=80+i*125});
 const ifNode=nodes.find(n=>n.type==="if");
 if(!ifNode)return;
 const branches=nodes.filter(n=>n.branch);
 const yes=branches.filter(n=>n.branch==="yes"),no=branches.filter(n=>n.branch==="no");
 if(yes.length||no.length){
  const yi=normal.findIndex(n=>n.id===ifNode.id);
  yes.forEach((n,i)=>{n.x=330;n.y=ifNode.y+150+i*110});
  no.forEach((n,i)=>{n.x=770;n.y=ifNode.y+150+i*110});
 }
 svg.setAttribute("viewBox","0 0 1100 "+Math.max(1000,150+nodes.length*125));
}
function draw(){
 ng.innerHTML="";ag.innerHTML="";
 const ifNode=nodes.find(n=>n.type==="if");
 // normal arrows
 const normal=nodes.filter(n=>!n.branch);
 for(let i=0;i<normal.length-1;i++){let a=normal[i],b=normal[i+1];ag.innerHTML+=`<line class="arrow" x1="${a.x}" y1="${a.y+50}" x2="${b.x}" y2="${b.y-50}"/>`}
 if(ifNode){
  const yes=nodes.filter(n=>n.branch==="yes"),no=nodes.filter(n=>n.branch==="no");
  if(yes.length){
   let y=yes[0];ag.innerHTML+=`<path class="arrow" d="M ${ifNode.x-90} ${ifNode.y} L ${y.x} ${y.y-50}"/>`;
   ag.innerHTML+=`<text class="branch-label" x="${(ifNode.x-90+y.x)/2}" y="${ifNode.y+5}" text-anchor="middle">Yes</text>`;
   for(let i=0;i<yes.length-1;i++){let a=yes[i],b=yes[i+1];ag.innerHTML+=`<line class="arrow" x1="${a.x}" y1="${a.y+50}" x2="${b.x}" y2="${b.y-50}"/>`}
  }else{ag.innerHTML+=`<text class="branch-label" x="${ifNode.x-155}" y="${ifNode.y+5}" text-anchor="middle">Yes</text>`}
  if(no.length){
   let n=no[0];ag.innerHTML+=`<path class="arrow" d="M ${ifNode.x+90} ${ifNode.y} L ${n.x} ${n.y-50}"/>`;
   ag.innerHTML+=`<text class="branch-label" x="${(ifNode.x+90+n.x)/2}" y="${ifNode.y+5}" text-anchor="middle">No</text>`;
   for(let i=0;i<no.length-1;i++){let a=no[i],b=no[i+1];ag.innerHTML+=`<line class="arrow" x1="${a.x}" y1="${a.y+50}" x2="${b.x}" y2="${b.y-50}"/>`}
  }else{ag.innerHTML+=`<text class="branch-label" x="${ifNode.x+155}" y="${ifNode.y+5}" text-anchor="middle">No</text>`}
 }
 nodes.forEach(n=>{
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","node"+(selectedId===n.id?" selected":""));g.setAttribute("transform",`translate(${n.x},${n.y})`);
  g.innerHTML=shape(n)+`<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">${esc(n.text)}</text><text text-anchor="middle" y="58" font-size="11" fill="#69758a">${n.branch?("Branch "+(n.branch==="yes"?"Yes":"No")):tname(n.type)}</text>`;
  g.onclick=e=>{e.stopPropagation();selectedId=n.id;updateBranchButtons();status.innerHTML="เลือก: <b>"+(n.branch?"Branch "+(n.branch==="yes"?"Yes":"No"):tname(n.type))+"</b> — "+esc(n.text);draw()};
  g.ondblclick=e=>{e.stopPropagation();selectedId=n.id;editNode()};
  g.onpointerdown=e=>startDrag(e,n);
  ng.appendChild(g);
 });
}
function updateBranchButtons(){
 const ok=nodes.some(n=>n.id===selectedId&&n.type==="if");
 document.getElementById("yesBtn").disabled=!ok;document.getElementById("noBtn").disabled=!ok;
 document.getElementById("branchHint").textContent=ok?"เลือกแขนงที่ต้องการเพิ่มบล็อกได้เลย":"เมื่อเลือก If จะสามารถเพิ่มบล็อกในแขนง Yes / No ได้";
}
function editNode(){
 const n=nodes.find(x=>x.id===selectedId);if(!n)return alert("กรุณาคลิกเลือกบล็อกก่อน");
 const v=prompt("แก้ข้อความในบล็อก:",n.text);if(v!==null&&v.trim()&&v.trim()!==n.text){save();n.text=v.trim();draw();updateBranchButtons()}
}
function deleteNode(){
 const i=nodes.findIndex(x=>x.id===selectedId);if(i<0)return alert("กรุณาคลิกเลือกบล็อกก่อน");
 save();nodes.splice(i,1);selectedId=null;layout();draw();updateBranchButtons();status.textContent="ลบบล็อกแล้ว";
}
function clearAll(){if(!nodes.length)return;if(!confirm("ต้องการล้าง Flowchart ทั้งหมดหรือไม่?"))return;save();nodes=[];selectedId=null;draw();updateBranchButtons();status.textContent="ล้างเรียบร้อย — กด Undo เพื่อย้อนกลับได้"}
function startDrag(e,n){e.preventDefault();e.stopPropagation();save();selectedId=n.id;updateBranchButtons();dragging=n;let p=point(e);dx=n.x-p.x;dy=n.y-p.y;svg.setPointerCapture(e.pointerId);draw()}
function point(e){let r=svg.getBoundingClientRect(),v=svg.viewBox.baseVal;return{x:(e.clientX-r.left)*v.width/r.width,y:(e.clientY-r.top)*v.height/r.height}}
svg.addEventListener("pointermove",e=>{if(!dragging)return;let p=point(e);dragging.x=p.x+dx;dragging.y=p.y+dy;draw()});
svg.addEventListener("pointerup",()=>{if(dragging){dragging=null;status.textContent="จัดตำแหน่งแล้ว"}});
svg.addEventListener("click",()=>{selectedId=null;updateBranchButtons();draw();status.textContent="ไม่ได้เลือกบล็อก"});
function runFlow(){
 const s=nodes.findIndex(n=>n.type==="start"),e=nodes.findIndex(n=>n.type==="end");
 if(s<0||e<0){status.className="status";status.innerHTML="<b>Run ไม่ได้</b> — ต้องมี Start และ End";return}
 if(s>e){status.className="status";status.innerHTML="<b>Run ไม่ได้</b> — Start ต้องอยู่ก่อน End";return}
 const normal=nodes.filter(n=>!n.branch),ifs=nodes.filter(n=>n.type==="if");
 let out=normal.map((n,i)=>(i+1)+". "+esc(n.text)).join("<br>");
 if(ifs.length){out+="<br><br><b>Decision</b>: "+esc(ifs[0].text);out+="<br>Yes → "+(nodes.filter(n=>n.branch==="yes").map(n=>esc(n.text)).join(" → ")||"ยังไม่มีบล็อก");out+="<br>No → "+(nodes.filter(n=>n.branch==="no").map(n=>esc(n.text)).join(" → ")||"ยังไม่มีบล็อก")}
 status.className="status ok";status.innerHTML="<b>Run สำเร็จ</b><br>"+out;status.scrollIntoView({behavior:"smooth",block:"center"});
}
document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>addLinear(b.dataset.add,selectedId)));
document.getElementById("yesBtn").onclick=()=>addToBranch("yes");
document.getElementById("noBtn").onclick=()=>addToBranch("no");
document.getElementById("editBtn").onclick=editNode;document.getElementById("deleteBtn").onclick=deleteNode;
document.getElementById("undoBtn").onclick=undo;document.getElementById("clearBtn").onclick=clearAll;document.getElementById("runBtn").onclick=runFlow;
addLinear("start");history=[];addLinear("end");history=[];updateBranchButtons();
})();
</script>
</body>
</html>
