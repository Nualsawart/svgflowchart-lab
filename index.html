<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Flowchart Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f6fa;color:#243047}
header{background:#fff;padding:15px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}.sub{font-size:13px;color:#69758a;margin-top:4px}
.toolbar{background:#fff;padding:12px 20px;border-bottom:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#e8edf5;color:#243047}
button:hover{filter:brightness(.97)}.run{background:#222;color:#fff;font-size:16px}.clear{background:#ffe5e5;color:#a22}
main{max-width:1100px;margin:18px auto;padding:0 16px}
.help,.status{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:14px}
.status{min-height:48px}.status.ok{border:2px solid #444}
.canvas{height:650px;background:#fff;border:1px solid #ddd;border-radius:14px;overflow:auto}
svg{width:100%;height:100%;min-width:700px;background:linear-gradient(#f8faff 1px,transparent 1px),linear-gradient(90deg,#f8faff 1px,transparent 1px);background-size:25px 25px}
.node{cursor:pointer}.node rect,.node polygon{fill:#fff;stroke:#39465a;stroke-width:2}
.node.selected rect,.node.selected polygon{stroke-width:4}.node text{pointer-events:none;user-select:none}
.arrow{stroke:#657184;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
@media(max-width:700px){header{display:block}h1{font-size:19px}.canvas{height:600px}}
</style>
</head>
<body>
<header>
<div><h1>SVG Flowchart Lab</h1><div class="sub">เครื่องมือเขียน Flowchart แบบง่าย สำหรับนักเรียน</div></div>
<button id="runBtn" class="run" type="button">▶ Run</button>
</header>
<div class="toolbar">
<button type="button" data-add="start">Start</button><button type="button" data-add="input">Input</button>
<button type="button" data-add="process">Process</button><button type="button" data-add="output">Output</button>
<button type="button" data-add="if">If</button><button type="button" data-add="end">End</button>
<button id="editBtn" type="button">แก้ข้อความ</button><button id="deleteBtn" type="button">ลบ</button>
<button id="clearBtn" class="clear" type="button">ล้างทั้งหมด</button>
</div>
<main>
<div class="help"><b>วิธีใช้:</b> เพิ่มสัญลักษณ์ → คลิกเลือก → ดับเบิลคลิกแก้ข้อความ → Run เพื่อทดลอง</div>
<div id="status" class="status">พร้อมใช้งาน — กด Run เพื่อทดลอง Flowchart</div>
<div class="canvas"><svg id="svg" viewBox="0 0 900 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#657184"/></marker></defs>
<g id="arrows"></g><g id="nodes"></g>
</svg></div>
</main>
<script>
(function(){
"use strict";
const svg=document.getElementById("svg"),ng=document.getElementById("nodes"),ag=document.getElementById("arrows"),status=document.getElementById("status");
let nodes=[],selectedId=null,nextId=1,dragging=null,dx=0,dy=0;
const defaults={start:"Start",input:"รับค่า x",process:"x = x + 10",output:"แสดงค่า x",if:"x > 10 ?",end:"End"};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function typeName(t){return {start:"Start / End",end:"Start / End",input:"Input",process:"Process",output:"Output",if:"Decision"}[t];}
function shape(n){
 if(n.type==="start"||n.type==="end")return '<rect x="-90" y="-30" width="180" height="60" rx="30"/>';
 if(n.type==="process")return '<rect x="-100" y="-32" width="200" height="64"/>';
 if(n.type==="input"||n.type==="output")return '<polygon points="-105,-32 75,-32 105,32 -75,32"/>';
 return '<polygon points="0,-48 115,0 0,48 -115,0"/>';
}
function arrange(){nodes.forEach((n,i)=>{n.x=450;n.y=70+i*115});svg.setAttribute("viewBox","0 0 900 "+Math.max(1000,100+nodes.length*115));}
function draw(){
 ng.innerHTML="";ag.innerHTML="";
 for(let i=0;i<nodes.length-1;i++){let a=nodes[i],b=nodes[i+1];ag.innerHTML+=`<line class="arrow" x1="${a.x}" y1="${a.y+50}" x2="${b.x}" y2="${b.y-50}"/>`;}
 nodes.forEach(n=>{
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","node"+(selectedId===n.id?" selected":""));g.setAttribute("transform",`translate(${n.x},${n.y})`);
  g.innerHTML=shape(n)+`<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">${esc(n.text)}</text>`;
  g.addEventListener("click",e=>{e.stopPropagation();selectedId=n.id;status.className="status";status.innerHTML="เลือก: <b>"+typeName(n.type)+"</b> — "+esc(n.text);draw();});
  g.addEventListener("dblclick",e=>{e.stopPropagation();selectedId=n.id;editNode();});
  g.addEventListener("pointerdown",e=>startDrag(e,n));ng.appendChild(g);
 });
}
function addNode(type){
 if(type==="start"&&nodes.some(n=>n.type==="start"))return;
 if(type==="end"&&nodes.some(n=>n.type==="end"))return;
 const n={id:nextId++,type:type,text:defaults[type]};
 if(type==="start")nodes.unshift(n);else if(type==="end")nodes.push(n);else{let i=nodes.findIndex(x=>x.type==="end");i<0?nodes.push(n):nodes.splice(i,0,n);}
 selectedId=n.id;arrange();draw();
}
function editNode(){
 const n=nodes.find(x=>x.id===selectedId);if(!n)return alert("กรุณาคลิกเลือกบล็อกก่อน");
 const v=prompt("แก้ข้อความในบล็อก:",n.text);if(v!==null&&v.trim()){n.text=v.trim();draw();}
}
function deleteNode(){
 const i=nodes.findIndex(x=>x.id===selectedId);if(i<0)return alert("กรุณาคลิกเลือกบล็อกก่อน");
 nodes.splice(i,1);selectedId=null;arrange();draw();status.className="status";status.textContent="ลบบล็อกแล้ว";
}
function clearAll(){if(confirm("ต้องการล้าง Flowchart ทั้งหมดหรือไม่?")){nodes=[];selectedId=null;arrange();draw();status.className="status";status.textContent="ล้างเรียบร้อย";}}
function point(e){let r=svg.getBoundingClientRect(),v=svg.viewBox.baseVal;return{x:(e.clientX-r.left)*v.width/r.width,y:(e.clientY-r.top)*v.height/r.height};}
function startDrag(e,n){e.preventDefault();e.stopPropagation();selectedId=n.id;dragging=n;let p=point(e);dx=n.x-p.x;dy=n.y-p.y;svg.setPointerCapture(e.pointerId);draw();}
svg.addEventListener("pointermove",e=>{if(!dragging)return;let p=point(e);dragging.x=p.x+dx;dragging.y=p.y+dy;draw();});
svg.addEventListener("pointerup",()=>{if(dragging){dragging=null;arrange();draw();}});
svg.addEventListener("click",()=>{selectedId=null;draw();});

function runFlow(){
 const s=nodes.findIndex(n=>n.type==="start"),e=nodes.findIndex(n=>n.type==="end");
 status.className="status";
 if(s<0||e<0){status.innerHTML="<b>Run ไม่ได้</b> — ต้องมี Start และ End";return;}
 if(s>e){status.innerHTML="<b>Run ไม่ได้</b> — Start ต้องอยู่ก่อน End";return;}
 const steps=nodes.slice(s,e+1).map((n,i)=>(i+1)+". "+esc(n.text)).join("<br>");
 status.className="status ok";status.innerHTML="<b>Run สำเร็จ</b><br>"+steps;
 status.scrollIntoView({behavior:"smooth",block:"center"});
}
document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>addNode(b.dataset.add)));
document.getElementById("editBtn").addEventListener("click",editNode);
document.getElementById("deleteBtn").addEventListener("click",deleteNode);
document.getElementById("clearBtn").addEventListener("click",clearAll);
document.getElementById("runBtn").addEventListener("click",runFlow);
addNode("start");addNode("end");
})();
</script>
</body>
</html>
