<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowchart Lab — Structured Flowgorithm Style</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f6fa;color:#26354d}
header{background:#fff;border-bottom:1px solid #d9dee8;padding:12px 18px}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:13px;color:#69758a}
.toolbar{background:#fff;border-bottom:1px solid #d9dee8;padding:10px 14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
button{border:1px solid #d7deea;border-radius:8px;padding:9px 12px;background:#fff;color:#26354d;font-weight:700;cursor:pointer}
button:hover{background:#f0f4fa}
button.active{outline:2px solid #4f7dff;background:#eef3ff}
.tool{min-width:86px;height:48px;position:relative}
.tool .mini{display:block;margin:0 auto 2px;width:42px;height:20px;border:2px solid #43516a;background:#fff}
.tool.start .mini,.tool.end .mini{border-radius:15px}
.tool.io .mini{clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);border-radius:0}
.tool.if .mini{border:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#fff;outline:2px solid #43516a}
.tool.while .mini{border:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#fff;outline:2px solid #43516a}
.statusbar{background:#fafbfe;border-bottom:1px solid #d9dee8;padding:9px 14px;font-size:13px;min-height:38px}
#status.ok{color:#23613b}#status.err{color:#a43a3a}
.workspace{height:calc(100vh - 145px);min-height:560px;overflow:auto;background:
linear-gradient(#e9edf4 1px,transparent 1px),
linear-gradient(90deg,#e9edf4 1px,transparent 1px);
background-size:20px 20px;padding:28px}
#canvas{display:block;margin:auto;background:rgba(255,255,255,.72);border:1px solid #e1e6ee;border-radius:10px}
.node{cursor:pointer}
.shape{fill:#fff;stroke:#40506a;stroke-width:2}
.node.selected .shape{stroke:#3974ff;stroke-width:3}
.node text{fill:#26354d;font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.flowline{fill:none;stroke:#6b778c;stroke-width:2;marker-end:url(#arrow)}
.branch-label{font-size:13px;font-weight:700;fill:#46536a}
.slot{cursor:pointer}
.slot circle{fill:#fff;stroke:#3974ff;stroke-width:2}
.slot text{fill:#3974ff;font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.slot:hover circle{fill:#eef4ff}
.slot.selected circle{fill:#3974ff}
.slot.selected text{fill:#fff}
.help{font-size:12px;color:#69758a;margin-left:4px}
</style>
</head>
<body>
<header>
  <h1>Flowchart Lab</h1>
  <div class="sub">Structured Flowchart แบบ Flowgorithm — เพิ่มบล็อกในลำดับ ไม่ต้องลากเส้นเอง</div>
</header>

<div class="toolbar">
  <button class="tool start" data-add="start"><span class="mini"></span>Start</button>
  <button class="tool io" data-add="input"><span class="mini"></span>Input</button>
  <button class="tool" data-add="process"><span class="mini"></span>Process</button>
  <button class="tool io" data-add="output"><span class="mini"></span>Output</button>
  <button class="tool if" data-add="if"><span class="mini"></span>If</button>
  <button class="tool while" data-add="while"><span class="mini"></span>While</button>
  <button class="tool end" data-add="end"><span class="mini"></span>End</button>
  <button id="editBtn">แก้ข้อความ</button>
  <button id="deleteBtn">ลบ</button>
  <button id="undoBtn">↶ Undo</button>
  <button id="clearBtn">ล้างทั้งหมด</button>
  <button id="runBtn">Run</button>
  <span class="help">คลิกวงกลม + ระหว่างบล็อก แล้วเลือกสัญลักษณ์จากด้านบน</span>
</div>

<div class="statusbar" id="status">เริ่มต้น: Start → End | คลิก + เพื่อเพิ่มบล็อก</div>
<div class="workspace">
  <svg id="canvas" width="1100" height="900" viewBox="0 0 1100 900"></svg>
</div>

<script>
const svg=document.getElementById("canvas");
const statusEl=document.getElementById("status");
let root=[
  {id:1,type:"start",text:"Start"},
  {id:2,type:"end",text:"End"}
];
let nextId=3;
let selectedSlot=null;
let selectedNode=null;
let history=[];

const defaults={
 start:"Start", end:"End", process:"Process",
 input:"รับข้อมูล", output:"แสดงผล", if:"x > 10 ?", while:"เงื่อนไข"
};

function uid(){return nextId++}
function clone(x){return JSON.parse(JSON.stringify(x))}
function save(){history.push(clone(root));if(history.length>30)history.shift()}
function changed(msg="แก้ไขแล้ว"){statusEl.className="";statusEl.textContent=msg}
function error(msg){statusEl.className="err";statusEl.textContent=msg}

function walk(list,fn,parent=null,branch=null){
  for(let i=0;i<list.length;i++){
    const n=list[i]; fn(n,list,i,parent,branch);
    if(n.type==="if"){
      walk(n.yes||[],fn,n,"yes");
      walk(n.no||[],fn,n,"no");
    }
    if(n.type==="while") walk(n.body||[],fn,n,"body");
  }
}
function findNode(id){
  let found=null;
  walk(root,(n,list,i,parent,branch)=>{if(n.id===id)found={n,list,i,parent,branch}});
  return found;
}
function allNodes(){const a=[];walk(root,(n)=>a.push(n));return a}

function makeNode(type){
  const n={id:uid(),type,text:defaults[type]||type};
  if(type==="if"){n.yes=[];n.no=[]}
  if(type==="while"){n.body=[]}
  return n;
}

/* slot = ตำแหน่ง "เพิ่มบล็อก" ในโครงสร้าง */
function slotInfo(){
  if(!selectedSlot)return null;
  return selectedSlot;
}

function insertAtSlot(type){
  const s=slotInfo();
  if(!s){error("ให้คลิก + ก่อน แล้วจึงเลือกสัญลักษณ์");return}
  if(type==="start"||type==="end"){error("Start และ End มีอยู่แล้วใน Flowchart");return}

  save();
  const n=makeNode(type);
  s.list.splice(s.index,0,n);
  selectedNode=n.id;
  selectedSlot=null;
  changed("เพิ่ม "+label(type)+" แล้ว");
  render();
}

function label(t){
  return ({process:"Process",input:"Input",output:"Output",if:"If",while:"While",start:"Start",end:"End"})[t]||t;
}

function editSelected(){
  if(!selectedNode){error("คลิกบล็อกที่ต้องการแก้ข้อความก่อน");return}
  const f=findNode(selectedNode);
  if(!f)return;
  const val=prompt("แก้ข้อความ",f.n.text);
  if(val===null)return;
  save(); f.n.text=val.trim()||defaults[f.n.type]||f.n.type;
  changed("แก้ข้อความแล้ว"); render();
}
function deleteSelected(){
  if(!selectedNode){error("คลิกบล็อกที่ต้องการลบก่อน");return}
  const f=findNode(selectedNode);
  if(!f)return;
  if(f.n.type==="start"||f.n.type==="end"){error("ไม่ลบ Start / End");return}
  save(); f.list.splice(f.i,1); selectedNode=null;
  changed("ลบบล็อกแล้ว"); render();
}
function undo(){
  if(!history.length){error("ยังไม่มีรายการให้ Undo");return}
  root=history.pop(); selectedNode=null; selectedSlot=null; changed("Undo แล้ว"); render();
}
function clearAll(){
  if(!confirm("ล้าง Flowchart และกลับเป็น Start → End ใช่หรือไม่?"))return;
  save(); root=[{id:1,type:"start",text:"Start"},{id:2,type:"end",text:"End"}];
  nextId=3;selectedNode=null;selectedSlot=null;changed("เริ่มต้นใหม่: Start → End");render();
}
function run(){
  const nodes=allNodes();
  const hasStart=nodes.some(n=>n.type==="start"), hasEnd=nodes.some(n=>n.type==="end");
  if(!hasStart||!hasEnd){error("Flowchart ต้องมี Start และ End");return}
  const hasIf=nodes.some(n=>n.type==="if");
  if(hasIf){
    const bad=nodes.find(n=>n.type==="if" && (!n.yes || !n.no));
    if(bad){error("If ต้องมีพื้นที่ True และ False");return}
  }
  statusEl.className="ok";
  statusEl.textContent="โครงสร้าง Flowchart ถูกต้อง: Start → ลำดับคำสั่ง → End";
}

/* ---------- layout ---------- */
const W=1100, CX=550;
function dims(type){
  if(type==="start"||type==="end")return {w:170,h:58};
  if(type==="process")return {w:190,h:62};
  if(type==="input"||type==="output")return {w:200,h:62};
  if(type==="if"||type==="while")return {w:210,h:92};
  return {w:170,h:58};
}
function textLines(text,max=22){
  const s=String(text);
  if(s.length<=max)return [s];
  const a=[];for(let i=0;i<s.length;i+=max)a.push(s.slice(i,i+max));
  return a.slice(0,2);
}

/*
  Structured layout:
  - sequence: top → bottom
  - If: false/yes branches split left/right
  - both branches rejoin automatically
  - no user-drawn edges
*/
function layout(){
  const boxes=[], lines=[], slots=[];
  let y=55;

  function addSeq(list,x,y0,mode="main"){
    let ycur=y0;
    list.forEach((n,i)=>{
      const d=dims(n.type);
      if(n.type==="if"){
        const top=ycur;
        boxes.push({n,x:CX,y:top,d});
        // slot before/after this If belongs to the containing sequence
        if(i<list.length) slots.push({list,index:i,x:CX,y:top-24});
        const branchTop=top+d.h+65;
        const branchGap=270;
        const leftX=CX-190,rightX=CX+190;
        const ly=branchTop, ry=branchTop;
        // branch contents
        const lres=addBranch(n.no||[],leftX,ly,"no");
        const rres=addBranch(n.yes||[],rightX,ry,"yes");
        const joinY=Math.max(lres.bottom,rres.bottom)+55;
        // If to branches
        lines.push({x1:CX,y1:top+d.h/2,x2:CX,y2:branchTop-25});
        lines.push({x1:CX,y1:branchTop-25,x2:leftX,y2:branchTop-25,label:"No"});
        lines.push({x1:CX,y1:branchTop-25,x2:rightX,y2:branchTop-25,label:"Yes"});
        // branch exits to join
        lines.push({x1:leftX,y1:lres.bottom,x2:leftX,y2:joinY});
        lines.push({x1:leftX,y1:joinY,x2:CX,y2:joinY});
        lines.push({x1:rightX,y1:rres.bottom,x2:rightX,y2:joinY});
        lines.push({x1:rightX,y1:joinY,x2:CX,y2:joinY});
        // empty branch slots
        if(!(n.no||[]).length) slots.push({list:n.no,index:0,x:leftX,y:branchTop});
        if(!(n.yes||[]).length) slots.push({list:n.yes,index:0,x:rightX,y:branchTop});
        // after If
        if(i<list.length-1)slots.push({list,index:i+1,x:CX,y:joinY+22});
        ycur=joinY+45;
      }else if(n.type==="while"){
        const top=ycur;
        boxes.push({n,x:CX,y:top,d});
        const bodyX=CX+190, bodyTop=top+d.h+65;
        const bodyRes=addBranch(n.body||[],bodyX,bodyTop,"body");
        lines.push({x1:CX,y1:top+d.h/2,x2:CX,y2:bodyTop-25});
        lines.push({x1:CX,y1:bodyTop-25,x2:bodyX,y2:bodyTop-25,label:"True"});
        lines.push({x1:bodyX,y1:bodyRes.bottom,x2:bodyX,y2:top+d.h/2});
        lines.push({x1:bodyX,y1:top+d.h/2,x2:CX+20,y2:top+d.h/2});
        lines.push({x1:CX+20,y1:top+d.h/2,x2:CX,y2:top+d.h/2});
        if(!(n.body||[]).length)slots.push({list:n.body,index:0,x:bodyX,y:bodyTop});
        ycur=Math.max(bodyRes.bottom,top+d.h)+65;
      }else{
        boxes.push({n,x:CX,y:ycur,d});
        if(i<list.length-1)slots.push({list,index:i+1,x:CX,y:ycur+d.h+25});
        if(i<list.length-1)lines.push({x1:CX,y1:ycur+d.h,x2:CX,y2:ycur+d.h+25});
        ycur+=d.h+50;
      }
    });
    return {bottom:ycur-10};
  }

  function addBranch(list,x,y0){
    let ycur=y0;
    list.forEach((n,i)=>{
      const d=dims(n.type);
      if(n.type==="if"){
        boxes.push({n,x,y:ycur,d});
        // Nested If: simple vertical branch layout inside its branch.
        const join=ycur+d.h+90;
        lines.push({x1:x,y1:ycur+d.h,x2:x,y2:join});
        ycur=join;
      }else{
        boxes.push({n,x,y:ycur,d});
        if(i<list.length-1)lines.push({x1:x,y1:ycur+d.h,x2:x,y2:ycur+d.h+25});
        if(i<list.length-1)slots.push({list,index:i+1,x,y:ycur+d.h+25});
        ycur+=d.h+50;
      }
    });
    return {bottom:ycur-10};
  }

  // Start with root sequence. The first slot is intentionally between Start and End.
  addSeq(root,CX,55);

  // slot at beginning is useful only if there is a gap after Start
  // Ensure a visible insertion point between Start and End for the initial state.
  if(root.length===2 && root[0].type==="start" && root[1].type==="end"){
    slots.length=0;
    const sy=55+dims("start").h;
    lines.length=0;
    boxes.length=0;
    boxes.push({n:root[0],x:CX,y:55,d:dims("start")});
    boxes.push({n:root[1],x:CX,y:55+dims("start").h+80,d:dims("end")});
    lines.push({x1:CX,y1:113,x2:CX,y2:138});
    slots.push({list:root,index:1,x:CX,y:150});
    lines.push({x1:CX,y1:162,x2:CX,y2:192});
  }
  return {boxes,lines,slots};
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function pathLine(l){
  if(l.label){
    const mid=(l.x1+l.x2)/2;
    return `<path class="flowline" d="M ${l.x1} ${l.y1} L ${l.x2} ${l.y2}"/>`+
      `<text class="branch-label" x="${mid}" y="${l.y1-7}">${esc(l.label)}</text>`;
  }
  return `<path class="flowline" d="M ${l.x1} ${l.y1} L ${l.x2} ${l.y2}"/>`;
}
function drawNode(b){
  const {n,x,y,d}=b, sel=n.id===selectedNode;
  let shape="";
  if(n.type==="start"||n.type==="end"){
    shape=`<rect class="shape" x="${x-d.w/2}" y="${y}" width="${d.w}" height="${d.h}" rx="${d.h/2}"/>`;
  }else if(n.type==="process"){
    shape=`<rect class="shape" x="${x-d.w/2}" y="${y}" width="${d.w}" height="${d.h}"/>`;
  }else if(n.type==="input"||n.type==="output"){
    const p=`${x-d.w/2+14},${y} ${x+d.w/2},${y} ${x+d.w/2-14},${y+d.h} ${x-d.w/2},${y+d.h}`;
    shape=`<polygon class="shape" points="${p}"/>`;
  }else if(n.type==="if"||n.type==="while"){
    const p=`${x},${y} ${x+d.w/2},${y+d.h/2} ${x},${y+d.h} ${x-d.w/2},${y+d.h/2}`;
    shape=`<polygon class="shape" points="${p}"/>`;
  }
  const lines=textLines(n.text);
  const tx=lines.length===1?`<text x="${x}" y="${y+d.h/2}">${esc(lines[0])}</text>`:
    lines.map((t,i)=>`<text x="${x}" y="${y+d.h/2-9+i*18}">${esc(t)}</text>`).join("");
  return `<g class="node ${sel?"selected":""}" data-node="${n.id}">${shape}${tx}</g>`;
}
function drawSlot(s){
  const selected=selectedSlot&&selectedSlot.list===s.list&&selectedSlot.index===s.index;
  return `<g class="slot ${selected?"selected":""}" data-slot="${slotIndex(s)}">
    <circle cx="${s.x}" cy="${s.y}" r="11"></circle><text x="${s.x}" y="${s.y}">+</text></g>`;
}
let currentSlots=[];
function slotIndex(s){return currentSlots.indexOf(s)}

function render(){
  const L=layout();currentSlots=L.slots;
  let maxY=400;
  L.boxes.forEach(b=>maxY=Math.max(maxY,b.y+b.d.h+80));
  svg.setAttribute("height",Math.max(650,maxY));
  let out=`<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b778c"/></marker></defs>`;
  L.lines.forEach(l=>out+=pathLine(l));
  L.boxes.forEach(b=>out+=drawNode(b));
  L.slots.forEach(s=>out+=drawSlot(s));
  svg.innerHTML=out;
}

svg.addEventListener("click",e=>{
  const slot=e.target.closest(".slot");
  const node=e.target.closest(".node");
  if(slot){
    const i=Number(slot.dataset.slot); selectedSlot=currentSlots[i]||null;selectedNode=null;
    changed("เลือกตำแหน่งแล้ว → เลือกสัญลักษณ์ด้านบน");render();return;
  }
  if(node){
    selectedNode=Number(node.dataset.node);selectedSlot=null;
    changed("เลือก "+label(findNode(selectedNode).n.type)+" → แก้ข้อความหรือลบ");render();return;
  }
});

document.querySelectorAll("[data-add]").forEach(btn=>{
  btn.addEventListener("click",()=>insertAtSlot(btn.dataset.add));
});
document.getElementById("editBtn").onclick=editSelected;
document.getElementById("deleteBtn").onclick=deleteSelected;
document.getElementById("undoBtn").onclick=undo;
document.getElementById("clearBtn").onclick=clearAll;
document.getElementById("runBtn").onclick=run;

render();
</script>
</body>
</html>
