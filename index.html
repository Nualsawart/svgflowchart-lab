<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Flowchart Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f6fa;color:#243047}
header{background:#fff;padding:15px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}.sub{font-size:13px;color:#69758a;margin-top:4px}
.toolbar{background:#fff;padding:12px 20px;border-bottom:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#e8edf5;color:#243047}
button:hover{filter:brightness(.97)}.run{background:#222;color:#fff}.clear{background:#ffe5e5;color:#a22}
main{max-width:1100px;margin:18px auto;padding:0 16px}
.help,.status{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:14px}
.canvas{height:650px;background:#fff;border:1px solid #ddd;border-radius:14px;overflow:auto}
svg{width:100%;height:100%;min-width:700px;background:linear-gradient(#f8faff 1px,transparent 1px),linear-gradient(90deg,#f8faff 1px,transparent 1px);background-size:25px 25px}
.node{cursor:pointer}
.node rect,.node polygon{fill:#fff;stroke:#39465a;stroke-width:2}
.node.selected rect,.node.selected polygon{stroke-width:4}
.node text{pointer-events:none;user-select:none}
.arrow{stroke:#657184;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
@media(max-width:700px){header{display:block}h1{font-size:19px}.canvas{height:600px}}
</style>
</head>
<body>
<header>
<div><h1>SVG Flowchart Lab</h1><div class="sub">เครื่องมือเขียน Flowchart แบบง่าย สำหรับนักเรียน</div></div>
<button class="run" onclick="runFlow()">▶ Run</button>
</header>

<div class="toolbar">
<button onclick="addNode('start')">Start</button>
<button onclick="addNode('input')">Input</button>
<button onclick="addNode('process')">Process</button>
<button onclick="addNode('output')">Output</button>
<button onclick="addNode('if')">If</button>
<button onclick="addNode('end')">End</button>
<button onclick="editNode()">แก้ข้อความ</button>
<button onclick="deleteNode()">ลบ</button>
<button class="clear" onclick="clearAll()">ล้างทั้งหมด</button>
</div>

<main>
<div class="help"><b>วิธีใช้:</b> เพิ่มสัญลักษณ์ → คลิกเลือก → ดับเบิลคลิกแก้ข้อความ → ลากเพื่อจัดตำแหน่ง → Run เพื่อทดลอง</div>
<div class="canvas">
<svg id="svg" viewBox="0 0 900 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z"/></marker></defs>
<g id="arrows"></g><g id="nodes"></g>
</svg>
</div>
<div class="status" id="status">เริ่มต้นด้วย Start หรือเลือกสัญลักษณ์ด้านบน</div>
</main>

<script>
const svg=document.getElementById("svg");
const nodesG=document.getElementById("nodes");
const arrowsG=document.getElementById("arrows");
const status=document.getElementById("status");

let nodes=[];
let selectedId=null;
let nextId=1;
let dragging=null;
let dragDX=0,dragDY=0;

const defaults={
start:"Start",
input:"รับค่า x",
process:"x = x + 10",
output:"แสดงค่า x",
if:"x > 10 ?",
end:"End"
};

function addNode(type){
  if(type==="start" && nodes.some(n=>n.type==="start")){
    selectNode(nodes.find(n=>n.type==="start").id); return;
  }
  if(type==="end" && nodes.some(n=>n.type==="end")){
    selectNode(nodes.find(n=>n.type==="end").id); return;
  }

  const node={id:nextId++,type,text:defaults[type]};

  if(type==="start"){
    nodes.unshift(node);
  }else if(type==="end"){
    nodes.push(node);
  }else{
    const endIndex=nodes.findIndex(n=>n.type==="end");
    if(endIndex>=0) nodes.splice(endIndex,0,node);
    else nodes.push(node);
  }

  selectedId=node.id;
  arrange();
  draw();
}

function arrange(){
  const gap=115;
  nodes.forEach((n,i)=>{
    n.x=450;
    n.y=70+i*gap;
  });
  svg.setAttribute("viewBox",`0 0 900 ${Math.max(1000,100+nodes.length*115)}`);
}

function shape(n){
  if(n.type==="start"||n.type==="end")
    return '<rect x="-90" y="-30" width="180" height="60" rx="30"/>';
  if(n.type==="process")
    return '<rect x="-100" y="-32" width="200" height="64"/>';
  if(n.type==="input"||n.type==="output")
    return '<polygon points="-105,-32 75,-32 105,32 -75,32"/>';
  return '<polygon points="0,-48 115,0 0,48 -115,0"/>';
}

function typeName(t){
  return {start:"Start / End",end:"Start / End",input:"Input",process:"Process",output:"Output",if:"Decision"}[t];
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function draw(){
  nodesG.innerHTML="";
  arrowsG.innerHTML="";

  for(let i=0;i<nodes.length-1;i++){
    const a=nodes[i],b=nodes[i+1];
    arrowsG.innerHTML+=`<line class="arrow" x1="${a.x}" y1="${a.y+50}" x2="${b.x}" y2="${b.y-50}"/>`;
  }

  nodes.forEach(n=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node"+(selectedId===n.id?" selected":""));
    g.setAttribute("transform",`translate(${n.x},${n.y})`);

    g.innerHTML=
      shape(n)+
      `<text text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700">${escapeHTML(n.text)}</text>`+
      `<text text-anchor="middle" y="58" font-size="11" fill="#69758a">${typeName(n.type)}</text>`;

    g.addEventListener("click",e=>{
      e.stopPropagation();
      selectNode(n.id);
    });

    g.addEventListener("dblclick",e=>{
      e.stopPropagation();
      selectNode(n.id);
      editNode();
    });

    g.addEventListener("pointerdown",e=>startDrag(e,n));

    nodesG.appendChild(g);
  });
}

function selectNode(id){
  selectedId=id;
  const n=nodes.find(x=>x.id===id);
  status.innerHTML=n
    ? `เลือก: <b>${typeName(n.type)}</b> — ${escapeHTML(n.text)}`
    : "ไม่ได้เลือกบล็อก";
  draw();
}

function editNode(){
  const n=nodes.find(x=>x.id===selectedId);
  if(!n){alert("กรุณาคลิกเลือกบล็อกก่อน");return}
  const value=prompt("แก้ข้อความในบล็อก:",n.text);
  if(value!==null && value.trim()!==""){
    n.text=value.trim();
    draw();
    selectNode(n.id);
  }
}

function deleteNode(){
  const index=nodes.findIndex(x=>x.id===selectedId);
  if(index<0){alert("กรุณาคลิกเลือกบล็อกก่อน");return}

  const n=nodes[index];
  if(n.type==="start" || n.type==="end"){
    if(!confirm(`ต้องการลบ ${n.type==="start"?"Start":"End"} หรือไม่?`)) return;
  }

  nodes.splice(index,1);
  selectedId=null;
  arrange();
  draw();
  status.textContent="ลบบล็อกแล้ว";
}

function clearAll(){
  if(!confirm("ต้องการล้าง Flowchart ทั้งหมดหรือไม่?")) return;
  nodes=[];
  selectedId=null;
  arrange();
  draw();
  status.textContent="ล้างเรียบร้อย";
}

function svgPoint(e){
  const r=svg.getBoundingClientRect();
  const vb=svg.viewBox.baseVal;
  return {
    x:(e.clientX-r.left)*vb.width/r.width,
    y:(e.clientY-r.top)*vb.height/r.height
  };
}

function startDrag(e,n){
  e.preventDefault();
  e.stopPropagation();
  selectedId=n.id;
  dragging=n;
  const p=svgPoint(e);
  dragDX=n.x-p.x;
  dragDY=n.y-p.y;
  svg.setPointerCapture(e.pointerId);
  draw();
}

svg.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const p=svgPoint(e);
  dragging.x=p.x+dragDX;
  dragging.y=p.y+dragDY;
  draw();
});

svg.addEventListener("pointerup",e=>{
  if(!dragging)return;
  dragging=null;
  arrange();
  draw();
});

svg.addEventListener("click",()=>{
  selectedId=null;
  draw();
  status.textContent="ไม่ได้เลือกบล็อก";
});

function runFlow(){
  const start=nodes.findIndex(n=>n.type==="start");
  const end=nodes.findIndex(n=>n.type==="end");

  if(start<0 || end<0){
    status.innerHTML="<b>Run ไม่ได้:</b> ต้องมี Start และ End";
    return;
  }

  if(start>end){
    status.innerHTML="<b>Run ไม่ได้:</b> Start ต้องอยู่ก่อน End";
    return;
  }

  const steps=nodes.slice(start,end+1)
    .map((n,i)=>`${i+1}. ${escapeHTML(n.text)}`)
    .join("<br>");

  status.innerHTML=`<b>กำลัง Run Flowchart</b><br>${steps}`;
}

addNode("start");
addNode("end");
</script>
</body>
</html>
